name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: fuzz-target build and smoke run
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Test binaries without debug info: the workspace has ~60 of them and the
  # runner's disk is small. Incremental builds are useless on a fresh runner.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # The nightly of the sanitizers and miri jobs (scripts/sanitizers.sh reads
  # it, and defaults to the same date). Pinned: a nightly without Miri, or a
  # rustc change to -Zsanitizer, must not change their result with no change
  # here. Bump it on purpose, together with the script's default.
  SANITIZER_NIGHTLY: nightly-2026-10-14

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PoW and difficulty references against their vectors
        run: python3 reference/check_vectors.py
      - name: Difficulty vectors are reproducible
        run: |
          python3 reference/gen_difficulty_vectors.py
          git diff --exit-code reference/difficulty_vectors.json
      - name: Block-rule (Merkle, coinbase commitment) vectors are reproducible
        run: |
          python3 reference/gen_merkle_vectors.py
          git diff --exit-code reference/merkle_vectors.json
      - name: Ledger reference tests
        run: python3 reference/test_ledger.py
      - name: Ledger vectors are reproducible
        run: |
          python3 reference/gen_ledger_vectors.py
          git diff --exit-code reference/ledger_vectors.json
      - name: Sighash v2/v3 vectors are reproducible
        run: |
          python3 reference/gnb_sighash.py
          git diff --exit-code reference/sighash_vectors.json

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Tests (release, includes both Python cross-checks)
        run: cargo test --release --locked

  # The consensus workspace: node, gnb-crypto, gnb-smh, coherence-core, the
  # wallet and the vendored forks. Dev profile with the per-package
  # opt-levels configured in the root Cargo.toml.
  workspace-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (librocksdb-sys needs clang/libclang)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: workspace-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  # POW-5: in a workspace-wide invocation the node's dev-dependency feature
  # `test-pow-limit` is unified into gnb-crypto and pins every expected target
  # to the pow limit. Test the consensus crates in their OWN invocations so
  # the real ASERT path is exercised.
  consensus-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: consensus-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: gnb-smh (PoW, compact bits, chain work, ASERT, Python vectors)
        run: cargo test -p gnb-smh --locked
      - name: gnb-crypto (real ASERT; test-pow-limit must be off)
        run: cargo test -p gnb-crypto --locked
      - name: The real-ASERT test ran and was not ignored
        run: |
          cargo test -p gnb-crypto --locked --lib expected_bits_at_schedule_is_genesis_bits 2>&1 \
            | tee /dev/stderr | grep -q "test result: ok. 1 passed; 0 failed; 0 ignored"
      - name: The release profile traps integer overflow (overflow-checks = true)
        run: |
          cargo test -p gnb-smh --locked --release --lib integer_overflow_panics_in_this_profile 2>&1 \
            | tee /dev/stderr | grep -q "test result: ok. 1 passed; 0 failed; 0 ignored"

  # Vendored forks: PQClean source pin (VENDOR.toml), the yamux lockfile guard
  # (GHSA-vxx9-2994-q338), and the Falcon clean-variant guard.
  vendored-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pqcrypto-internals (tests/vendor_pin.rs + unit tests)
        run: cargo test -p pqcrypto-internals --locked
      - name: libp2p-yamux (tests/lockfile_guard.rs + unit tests)
        run: cargo test -p libp2p-yamux --locked
      - name: Falcon clean-variant guard
        run: sh scripts/falcon-clean-guard.sh

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (librocksdb-sys needs clang/libclang)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      # Fails on every deny-level lint (clippy's correctness group and any
      # `#![deny]` in the code); warnings are reported, not fatal.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny (advisories, bans, licenses, sources; deny.toml)
        run: cargo deny check
      - name: cargo audit (exceptions in .cargo/audit.toml)
        run: cargo audit

  # Independent consistency harness from the 2026-10 code audit: Bitcoin Core,
  # BCHN aserti3-2d and rust-bitcoin oracles, and the normative Python
  # GnB-SMH. Its own workspace and lockfile.
  audit-harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit/consistency
    steps:
      - uses: actions/checkout@v4
      - name: Consistency harness (release)
        run: cargo test --release --locked

  # Sanitizers over the consensus crates (scripts/sanitizers.sh,
  # docs/testing/SANITIZERS.md). AddressSanitizer + LeakSanitizer instrument
  # the Rust code (nightly -Zsanitizer=address) AND the PQClean C code that
  # the pqcrypto build scripts compile (clang -fsanitize=address); then
  # UndefinedBehaviorSanitizer instruments that C code (gcc, no recovery).
  # Each mode checks that every PQClean archive really is instrumented. The
  # runner has AVX2, so ML-DSA runs its AVX2 code there; the last step runs
  # the UBSan ML-DSA tests on qemu's Nehalem CPU (no AVX2) so the clean ML-DSA
  # C code (non-AVX2 nodes, the wasm32 wallet) runs under UBSan too.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain (pinned)
        run: rustup toolchain install "$SANITIZER_NIGHTLY" --profile minimal
      - name: clang, the UBSan runtime and qemu-user
        run: sudo apt-get update && sudo apt-get install -y clang libubsan1 qemu-user
      # Older ASan runtimes crash under the runner kernel's 32-bit mmap ASLR
      # entropy; 28 bits is what they support. Harmless for current ones.
      - name: ASLR entropy compatible with the ASan shadow layout
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: AddressSanitizer + LeakSanitizer (gnb-smh, gnb-crypto, pqcrypto-internals; Rust and C)
        run: sh scripts/sanitizers.sh asan
      - name: UndefinedBehaviorSanitizer (PQClean C under gnb-crypto and pqcrypto-internals)
        run: sh scripts/sanitizers.sh ubsan
      - name: UBSan on a CPU without AVX2 (clean ML-DSA C code; ML-DSA, wallet signing and ACVP tests)
        run: sh scripts/sanitizers.sh ubsan-noavx2

  # Miri: undefined behaviour in the pure-Rust consensus arithmetic (gnb-smh
  # difficulty/compact/ASERT/work, gnb-crypto core::limits, tokenomics,
  # block_rules, sighash, activation) and in the unsafe RNG override of
  # pqcrypto-internals; then gnb-smh (with the Python PoW vectors) on a
  # 32-bit and a big-endian target, and the wasm wallet's C ABI on i686.
  # Miri-incompatible tests carry #[cfg_attr(miri, ignore = "<why>")]; the
  # script fails a step whose passed-test count drops below its minimum.
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # local reference: about 15 minutes in total
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain with Miri (pinned)
        run: |
          rustup toolchain install "$SANITIZER_NIGHTLY" --profile minimal --component miri,rust-src
          cargo +"$SANITIZER_NIGHTLY" miri setup
      # gnb-wallet-wasm's dependencies compile the PQClean C for i686 in their
      # build scripts (Miri never executes it).
      - name: multilib gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Miri (host)
        run: sh scripts/sanitizers.sh miri
      - name: Miri (gnb-smh on i686 and s390x, gnb-wallet-wasm C ABI on i686)
        run: sh scripts/sanitizers.sh miri-cross

  # 32-bit build and tests (usize = 32 bits: the CRY-8 overflow class) of the
  # consensus crates and the wasm wallet core on i686-unknown-linux-gnu,
  # pinned toolchain.
  i686:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 32-bit target and multilib gcc (PQClean C)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib
          cargo --version   # installs the rust-toolchain.toml toolchain
          rustup target add i686-unknown-linux-gnu
      - name: gnb-smh, gnb-crypto, coherence-core, pqcrypto-internals, gnb-wallet-wasm on i686
        run: sh scripts/sanitizers.sh i686

  # Builds every cargo-fuzz target (node/fuzz, nightly + libFuzzer) and runs
  # each briefly over its committed seed corpus.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (librocksdb-sys needs clang/libclang)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Start from the audited lockfile
        run: cp Cargo.lock node/fuzz/Cargo.lock
      - name: Build all fuzz targets
        working-directory: node/fuzz
        run: cargo +nightly fuzz build
      - name: Smoke-run each target over its seed corpus
        working-directory: node/fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            mkdir -p "corpus/$t"
            cargo +nightly fuzz run "$t" "corpus/$t" -- -max_total_time=30 -rss_limit_mb=4096
          done
