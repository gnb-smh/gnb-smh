name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PoW reference against test vectors
        run: python3 reference/check_vectors.py
      - name: Ledger reference tests
        run: python3 reference/test_ledger.py
      - name: Ledger vectors are reproducible
        run: |
          python3 reference/gen_ledger_vectors.py
          git diff --exit-code reference/ledger_vectors.json

  rust-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tests (release, includes both Python cross-checks)
        run: cargo test --release --locked

  # The node and every consensus crate. The toolchain comes from
  # rust-toolchain.toml.
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: System dependencies (RocksDB bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Toolchain
        run: rustup show
      - name: Build
        run: cargo build --workspace --release --locked
      - name: Tests
        run: cargo test --workspace --release --locked
      - name: Clippy (correctness and suspicious lints are errors)
        run: cargo clippy --workspace --all-targets --release --locked -- -D clippy::correctness -D clippy::suspicious

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Coverage-guided fuzzing of every wire decoder and the block validator.
  # Short runs on every push; a crash fails the job and uploads the input.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [tx_parse, block_parse, netmsg_decode, sync_decode, block_validate]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: System dependencies (RocksDB bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} (120 s)
        working-directory: node
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -max_total_time=120
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: node/fuzz/artifacts/${{ matrix.target }}
