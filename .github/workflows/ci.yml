name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: fuzz-target build and smoke run
    - cron: "41 4 * * 0"   # weekly (Sunday): full mutation-testing run
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Test binaries without debug info: the workspace has ~60 of them and the
  # runner's disk is small. Incremental builds are useless on a fresh runner.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PoW and difficulty references against their vectors
        run: python3 reference/check_vectors.py
      - name: Difficulty vectors are reproducible
        run: |
          python3 reference/gen_difficulty_vectors.py
          git diff --exit-code reference/difficulty_vectors.json
      - name: Block-rule (Merkle, coinbase commitment) vectors are reproducible
        run: |
          python3 reference/gen_merkle_vectors.py
          git diff --exit-code reference/merkle_vectors.json
      - name: Ledger reference tests
        run: python3 reference/test_ledger.py
      - name: Ledger vectors are reproducible
        run: |
          python3 reference/gen_ledger_vectors.py
          git diff --exit-code reference/ledger_vectors.json
      - name: Sighash v2/v3 vectors are reproducible
        run: |
          python3 reference/gnb_sighash.py
          git diff --exit-code reference/sighash_vectors.json
      # docs/testing/VECTORS.md: every derived value, every non-signature
      # verdict and every mempool refusal class of the tx/block consensus
      # vectors, re-derived by the Python references (gnb_validity,
      # gnb_merkle, gnb_sighash, gnb_difficulty; gnb_smh evaluates the three
      # `pow: full` proofs, ~2 s each).
      - name: Consensus tx/block vectors against the Python references
        run: python3 reference/check_consensus_vectors.py

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Tests (release, includes both Python cross-checks)
        run: cargo test --release --locked

  # The consensus workspace: node, gnb-crypto, gnb-smh, coherence-core, the
  # wallet and the vendored forks. Dev profile with the per-package
  # opt-levels configured in the root Cargo.toml.
  workspace-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (librocksdb-sys needs clang/libclang)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: workspace-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  # POW-5: in a workspace-wide invocation the node's dev-dependency feature
  # `test-pow-limit` is unified into gnb-crypto and pins every expected target
  # to the pow limit. Test the consensus crates in their OWN invocations so
  # the real ASERT path is exercised.
  consensus-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: consensus-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: gnb-smh (PoW, compact bits, chain work, ASERT, Python vectors)
        run: cargo test -p gnb-smh --locked
      - name: gnb-crypto (real ASERT; test-pow-limit must be off)
        run: cargo test -p gnb-crypto --locked
      - name: The real-ASERT test ran and was not ignored
        run: |
          cargo test -p gnb-crypto --locked --lib expected_bits_at_schedule_is_genesis_bits 2>&1 \
            | tee /dev/stderr | grep -q "test result: ok. 1 passed; 0 failed; 0 ignored"
      # docs/testing/VECTORS.md: the deterministic Rust generator (seeded keys
      # and signatures) must reproduce the frozen tx/block consensus vectors
      # byte for byte. Their runners are tests/consensus_vectors.rs (above,
      # real pow limit) and node/tests/consensus_vectors.rs (workspace-test).
      - name: Consensus tx/block vectors are reproducible
        run: |
          GNB_WRITE_VECTORS=1 cargo test -p gnb-crypto --locked --test gen_consensus_vectors -- --ignored
          git diff --exit-code reference/tx_vectors.json reference/block_vectors.json

  # Vendored fork: PQClean source pin (VENDOR.toml), and the Falcon
  # clean-variant guard. (The libp2p-yamux fork was retired with libp2p 0.57,
  # audit OPS-2; its yamux lockfile guard, GHSA-vxx9-2994-q338, now lives in
  # node/tests/supply_chain_lockfile_guard.rs and runs in workspace-test, and
  # `cargo deny` in supply-chain refuses a second yamux.)
  vendored-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pqcrypto-internals (tests/vendor_pin.rs + unit tests)
        run: cargo test -p pqcrypto-internals --locked
      - name: Falcon clean-variant guard
        run: sh scripts/falcon-clean-guard.sh

  # WAL-5: the committed browser wallet core must be reproducible from source.
  # Rebuild it with the pinned toolchain (rust-toolchain.toml, 1.94.1) and the
  # pinned wasi-sdk 25 (download checked against its SHA-256) through
  # scripts/build-wallet-wasm.sh, and fail if the binary's SHA-256 differs from
  # the pin in site/wallet/app.js (which loadCore enforces in the browser) or
  # from the committed site/wallet/gnb_wallet.wasm. Any source change that
  # reaches the WASM (panic locations included) requires re-running the
  # script and committing the new binary and pin.
  wasm-reproducible:
    runs-on: ubuntu-latest
    env:
      WASI_SDK_VERSION: "25"
      WASI_SDK_SHA256: "52640dde13599bf127a95499e61d6d640256119456d1af8897ab6725bcf3d89c"
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.94.1 with the wasm32-wasip1 target
        run: |
          rustup toolchain install 1.94.1 --profile minimal --target wasm32-wasip1
          test "$(rustc --version | cut -d' ' -f2)" = "1.94.1"
      - name: wasi-sdk 25 (pinned download and checksum)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          echo "${WASI_SDK_SHA256}  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
      - name: Rebuild the wallet core and compare with the pin
        run: |
          pinned=$(sed -n 's/^const WASM_SHA256 = "\([0-9a-f]*\)";/\1/p' site/wallet/app.js)
          committed=$(sha256sum site/wallet/gnb_wallet.wasm | cut -d' ' -f1)
          WASI_SDK="$RUNNER_TEMP/wasi-sdk" sh scripts/build-wallet-wasm.sh
          rebuilt=$(sha256sum site/wallet/gnb_wallet.wasm | cut -d' ' -f1)
          echo "pinned    $pinned"
          echo "committed $committed"
          echo "rebuilt   $rebuilt"
          test -n "$pinned"
          test "$committed" = "$pinned"
          test "$rebuilt" = "$pinned"
          # The script re-pins and refreshes the SRI hashes: nothing may change.
          git diff --exit-code -- site/

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (librocksdb-sys needs clang/libclang)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      # Fails on every deny-level lint (clippy's correctness group and any
      # `#![deny]` in the code); warnings are reported, not fatal.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny (advisories, bans, licenses, sources; deny.toml)
        run: cargo deny check
      - name: cargo audit (exceptions in .cargo/audit.toml)
        run: cargo audit

  # Independent consistency harness from the 2026-10 code audit: Bitcoin Core,
  # BCHN aserti3-2d and rust-bitcoin oracles, and the normative Python
  # GnB-SMH. Its own workspace and lockfile.
  audit-harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit/consistency
    steps:
      - uses: actions/checkout@v4
      - name: Consistency harness (release)
        run: cargo test --release --locked

  # Builds every cargo-fuzz target (node/fuzz, nightly + libFuzzer) and runs
  # each briefly over its committed seed corpus.
  fuzz:
    if: github.event.schedule == '17 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (librocksdb-sys needs clang/libclang)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Start from the audited lockfile
        run: cp Cargo.lock node/fuzz/Cargo.lock
      - name: Build all fuzz targets
        working-directory: node/fuzz
        run: cargo +nightly fuzz build
      - name: Smoke-run each target over its seed corpus
        working-directory: node/fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            mkdir -p "corpus/$t"
            cargo +nightly fuzz run "$t" "corpus/$t" -- -max_total_time=30 -rss_limit_mb=4096
          done

  # Mutation testing of the consensus code (cargo-mutants). Scope, exclusions
  # and the documented equivalent mutants: .cargo/mutants.toml; method and
  # results: docs/testing/MUTATION.md. Weekly and on demand, every mutant of
  # the scope; each crate in its own invocation (the node's test-pow-limit
  # feature is never unified into gnb-crypto), gnb-crypto in shards. Fails on
  # any missed (surviving) mutant, on any timeout that is not a known hang
  # (.cargo/mutants-timeouts.txt), on a baseline failure and on any other
  # cargo-mutants error (scripts/mutants-gate.sh); and when the
  # equivalent-mutant exclusions no longer match the documented list
  # (scripts/mutants-equivalent-check.sh).
  mutants:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 4 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: gnb-smh, shard: "0/1" }
          - { package: gnb-crypto, shard: "0/4" }
          - { package: gnb-crypto, shard: "1/4" }
          - { package: gnb-crypto, shard: "2/4" }
          - { package: gnb-crypto, shard: "3/4" }
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Equivalent-mutant exclusions match the documented list
        if: matrix.package == 'gnb-smh'
        run: scripts/mutants-equivalent-check.sh
      - name: cargo mutants -p ${{ matrix.package }} --shard ${{ matrix.shard }}
        run: >
          scripts/mutants-gate.sh "$RUNNER_TEMP/mutants"
          -p ${{ matrix.package }} --shard ${{ matrix.shard }} --test-tool cargo -j 2 --no-shuffle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ matrix.package }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/mutants/mutants.out

  # Pull requests: only the mutants on lines the PR changes (--in-diff against
  # the base branch). A PR that touches no in-scope line tests no mutant.
  mutants-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Equivalent-mutant exclusions match the documented list
        run: scripts/mutants-equivalent-check.sh
      - name: Diff against the base branch
        if: success() || failure()
        run: git diff "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/pr.diff"
      - name: gnb-smh mutants in the diff
        if: success() || failure()
        run: >
          scripts/mutants-gate.sh "$RUNNER_TEMP/mutants-gnb-smh"
          -p gnb-smh --in-diff "$RUNNER_TEMP/pr.diff" --test-tool cargo -j 2 --no-shuffle
      - name: gnb-crypto mutants in the diff
        if: success() || failure()
        run: >
          scripts/mutants-gate.sh "$RUNNER_TEMP/mutants-gnb-crypto"
          -p gnb-crypto --in-diff "$RUNNER_TEMP/pr.diff" --test-tool cargo -j 2 --no-shuffle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-diff
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/mutants-gnb-smh/mutants.out
            ${{ runner.temp }}/mutants-gnb-crypto/mutants.out
