name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reference against test vectors
        run: python3 reference/check_vectors.py

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Tests (release, includes the Python cross-check)
        run: cargo test --release --locked
