name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PoW reference against test vectors
        run: python3 reference/check_vectors.py
      - name: Ledger reference tests
        run: python3 reference/test_ledger.py
      - name: Ledger vectors are reproducible
        run: |
          python3 reference/gen_ledger_vectors.py
          git diff --exit-code reference/ledger_vectors.json

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Tests (release, includes both Python cross-checks)
        run: cargo test --release --locked
