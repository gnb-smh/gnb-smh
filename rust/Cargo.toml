[package]
name = "gnb-smh"
version = "0.1.0"
edition = "2021"
description = "GnB-SMH v1 (Gödel and Bell Sequential Memory-Hard): post-quantum proof-of-work over SHAKE-256, reference implementation"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
keccak = "0.1"
sha3 = "0.10"

[dev-dependencies]
serde_json = "1"
hex = "0.4"

# Its own workspace (the root workspace excludes it). Explicit, so cargo never
# walks up into an enclosing checkout's workspace (e.g. a worktree nested
# inside another clone).
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
