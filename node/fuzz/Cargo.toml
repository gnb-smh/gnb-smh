# cargo-fuzz targets for the node's untrusted-input surfaces (audit OPS-1).
#
# Its own workspace (excluded from the root one): libFuzzer needs nightly and
# sanitizer flags, which must never leak into the consensus build.
#
#   cp Cargo.lock node/fuzz/Cargo.lock      # start from the audited lockfile
#   cd node/fuzz
#   cargo +nightly fuzz build               # all targets (cargo install cargo-fuzz)
#   cargo +nightly fuzz run tx_parse        # seeds: corpus/tx_parse/
#
# Targets and the seed corpus each starts from (corpus/<target>/; the seeds are
# generated and replayed on stable by node/tests/parser_corpus_floor.rs for
# the first nine targets except header_parse, and by
# node/tests/fuzz_seed_corpus.rs for header_parse and the others):
#
#   tx_parse          Transaction::from_wire_bytes (+ decode/encode idempotence)
#   block_parse       Block::from_wire_bytes (+ idempotence)
#   header_parse      BlockHeader::from_wire_bytes (+ idempotence)
#   netmsg_decode     gnb::network::decode_wire_message (gossip frames)
#   handshake_decode  transport handshake messages (HandshakeInit / HandshakeResp)
#   pow_decode        compact bits <-> target, chain work, ASERT (vs a U512 oracle)
#   pow_verify        GnB-SMH output vs target (small scratchpad), hybrid signature verify
#   merkle_path       coherence_core::verify_path
#   mempool_ops       Mempool op stream with the txs/spent/rate-index invariant
#   block_rules       hardening block rules vs independent references (Merkle, commitment, 64-byte)
#   sighash           sighash v2 / v3 vs independent references; single-field sensitivity
#   witness_parse     script_sig framing (lenient / exact / canonical witness)
#   wire_roundtrip    Transaction / BlockHeader / Block encode-decode round trips, strictness
#   undo_decode       UndoData stored encoding (legacy and extended)
#   keystore_decode   keyfile v1/v2 and keystore v2/v3 JSON parse + decrypt (fast KDF)
#   address_parse     Address::parse / parse_for_network vs a reference parser
#   sync_rr_codec     /gnb/sync/1 frames and the libp2p codec (bounds, canonicality, read cap)
#   accept_dag        accept_block on small DAGs: arrival-order independence
#
# docs/testing/FUZZING.md describes every target, the campaign results and
# how to reproduce them.
#
# `cargo check` on stable type-checks the targets (libfuzzer-sys builds there
# too); actually fuzzing needs nightly + cargo-fuzz. Copy the root lockfile
# first in every case (node/fuzz/Cargo.lock is not committed): without it
# cargo resolves this workspace afresh to the newest semver-compatible
# versions on crates.io, not the audited ones.

[package]
name = "gnb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gnb = { path = ".." }
# `test-pow-limit` (tests only; a gnb binary with it refuses mainnet, and an
# optimised one every network: `test_pow_limit_guard` in node/src/main.rs) pins every
# expected target to the pow limit: one GnB-SMH evaluation seals a block, which
# is what lets `accept_dag` drive the real pipeline. No other target reads the
# expected bits or the pow limit.
gnb-crypto = { path = "../../crates/gnb-crypto", features = ["test-pow-limit"] }
gnb-smh = { path = "../../crates/gnb-smh" }
coherence-core = { path = "../../crates/coherence-core" }
bincode = { version = "2", features = ["serde"] }
primitive-types = "0.13"
# Independent reference implementations and fixtures (all already in the
# workspace lockfile).
sha2 = "0.10"
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
tempfile = "3"
parking_lot = "0.12"
pqcrypto-internals = "0.2"
# sync_rr_codec drives the node's libp2p request-response codec
# (`BlochSyncCodec`) over an in-memory stream with a `futures` executor and
# `futures::io::Cursor` (same 0.3 requirement as the node, so one crate
# instance). The `Codec` trait comes from the node's own libp2p, re-exported
# as `gnb::libp2p`: this crate does not name libp2p, so it cannot resolve to
# a libp2p other than the node's (the libp2p upgrade needs no edit here).
futures = "0.3"

[workspace]
members = ["."]

[patch.crates-io]
# Same patches as the root workspace.
pqcrypto-internals = { path = "../../crates/pqcrypto-internals" }

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "tx_parse"
path = "fuzz_targets/tx_parse.rs"
test = false
doc = false
bench = false

