[workspace]
resolver = "2"
# GnB — Gödel and Bell. A proof-of-work hard fork of the Bloch codebase:
# the Bloch BlockDAG node (GhostDAG, hybrid ML-DSA-65 ‖ Falcon-1024
# transactions) with its proof of work replaced by GnB-SMH, a sequential
# memory-hard SHAKE-256 function, and a fresh genesis.
members = [
    "crates/gnb-smh",         # the proof of work: GnB-SMH v1 + difficulty (ASERT)
    "crates/gnb-crypto",      # consensus types, transactions, wallet, signatures
    "crates/coherence-core",  # shielded-pool primitives used by the block format
    "node",                   # the `gnb` full node, `gnb-cli`, `gnb-wallet`
]

# GnB-SMH is 2^20 Keccak permutations per evaluation; unoptimized it makes
# every test that touches a block take seconds. Optimize the hashing crates in
# dev/test builds only; release output is unaffected.
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
[profile.dev.package.gnb-smh]
opt-level = 3
# Argon2id is memory-hard by design; unoptimized it makes keystore tests slow.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level       = 3
lto             = true
codegen-units   = 1
# Mandatory for consensus builds: every profile must fail closed identically
# on integer overflow (panic), never wrap in release and panic in debug.
overflow-checks = true

[patch.crates-io]
# Vendored fork of pqcrypto-internals 0.2.11 adding scoped seeded-RNG support
# for deterministic ML-DSA-65 / Falcon key generation (Wallet::from_seed).
pqcrypto-internals = { path = "crates/pqcrypto-internals" }
# Vendored libp2p-yamux with the vulnerable yamux 0.12 backend removed
# (GHSA-vxx9-2994-q338). Drop when upstream libp2p sheds yamux 0.12.
libp2p-yamux = { path = "crates/libp2p-yamux" }
