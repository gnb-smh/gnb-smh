# gnb-smh.com: static site (./site) plus the read-only explorer API proxy
# (worker/index.js, /api/*). Deploy from the repository root: wrangler deploy
# The origin shared secret is a Worker secret: wrangler secret put GNB_API_KEY
#
# WAL-2: the explorer origins are configuration, not code. Set them as a
# secret or dashboard variable (comma-separated, https:// only; plain http://
# entries are ignored and the API answers 503 until one https origin is set):
#   wrangler secret put GNB_ORIGINS
#   e.g. https://explorer-origin-1.example.net,https://explorer-origin-2.example.net
# Each origin terminates TLS itself or is a Cloudflare Tunnel hostname; see
# deploy/explorer-api/README.md.
name = "gnb-smh"
main = "worker/index.js"
compatibility_date = "2026-09-01"
# Keep the *.workers.dev address alive alongside the custom domains.
workers_dev = true
routes = [
  { pattern = "gnb-smh.com", custom_domain = true },
  { pattern = "www.gnb-smh.com", custom_domain = true },
]

[assets]
directory = "./site"
binding = "ASSETS"
# WAL-3: run the Worker for EVERY path, so the Content-Security-Policy, HSTS
# and the other security headers it sets apply site-wide (they used to reach
# only /api/* and /wallet*). The site's own test (site/tests) pins this.
run_worker_first = true
