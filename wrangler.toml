# gnb-smh.com: static site (./site) plus the read-only explorer API proxy
# (worker/index.js, /api/*). Deploy from the repository root: wrangler deploy
# The origin shared secret is a Worker secret: wrangler secret put GNB_API_KEY
name = "gnb-smh"
main = "worker/index.js"
compatibility_date = "2026-09-01"
# Keep the *.workers.dev address alive alongside the custom domains.
workers_dev = true
routes = [
  { pattern = "gnb-smh.com", custom_domain = true },
  { pattern = "www.gnb-smh.com", custom_domain = true },
]

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*", "/wallet", "/wallet/*", "/wallet.html"]
