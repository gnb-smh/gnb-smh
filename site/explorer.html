<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GnB Explorer</title>
<meta name="description" content="Block explorer for GnB, the GnB-SMH proof-of-work BlockDAG: blocks, the GhostDAG, transactions, addresses and holders.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="GnB Explorer"><meta property="og:image" content="/og-image.png"><meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root {
  --void: #000000; --panel: #0b0907; --panel-2: #14100c; --line: #2b2420; --line-2: #3d332c;
  --ink: #ffffff; --text: #e6e0da; --mute: #a0958d; --fluor: #ff5f15; --fluor-hi: #ffb547; --fluor-ink: #170600;
  /* Chart marks (validated on #000: lightness band, chroma, CVD, contrast). */
  --mark: #f04a00; --dag-chain: #f04a00; --dag-blue: #3f8ff0; --dag-red: #c04fc0;
  --f-display: "Poppins", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --f-text: "Figtree", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --wrap: 1180px; --gutter: clamp(16px, 4vw, 40px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--void); }
body { margin: 0; background: var(--void); color: var(--text); font-family: var(--f-text); font-size: 1rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--ink); text-decoration-color: var(--fluor); text-underline-offset: 3px; }
a:hover { color: var(--fluor-hi); }
:focus-visible { outline: 2px solid var(--fluor); outline-offset: 3px; border-radius: 2px; }
::selection { background: var(--fluor); color: var(--fluor-ink); }
h1, h2, h3 { font-family: var(--f-display); color: var(--ink); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
p { margin: 0; }
.mono, code { font-family: var(--f-mono); font-feature-settings: "zero" 1; }
.wrap { width: 100%; max-width: calc(var(--wrap) + 2 * var(--gutter)); margin-inline: auto; padding-inline: var(--gutter); }

.top { position: sticky; top: 0; z-index: 10; background: rgba(0,0,0,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 60px; }
.brandlink { display: flex; align-items: center; gap: 12px; flex: none; text-decoration: none; }
.brandlink .mono-tile { width: 30px; height: 30px; display: block; }
.brandlink .wm { width: 112px; height: auto; display: block; }
.tag { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--fluor); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 6px; }
.nav { display: flex; gap: 20px; margin-left: auto; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); text-decoration: none; white-space: nowrap; padding-block: 6px; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--ink); }

.searchbar { border-bottom: 1px solid var(--line); background: var(--panel); }
.searchbar form { display: flex; gap: 10px; padding-block: 14px; }
.searchbar input { flex: 1; min-width: 0; background: var(--void); color: var(--ink); border: 1px solid var(--line-2); border-radius: 6px; padding: 11px 14px; font-family: var(--f-mono); font-size: .85rem; }
.searchbar input::placeholder { color: var(--mute); }
.searchbar input:focus { outline: none; border-color: var(--fluor); }
.btn { font-family: var(--f-display); font-weight: 600; font-size: .9rem; padding: 10px 18px; border-radius: 6px; border: 1px solid var(--fluor); background: var(--fluor); color: var(--fluor-ink); cursor: pointer; }
.btn:hover { background: var(--fluor-hi); border-color: var(--fluor-hi); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--ink); }
.btn[disabled] { opacity: .4; cursor: default; }

main { padding-block: 28px 80px; min-height: 70vh; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--fluor); }
.pagehead { display: grid; gap: 10px; margin-bottom: 26px; }
.pagehead h1 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); }
.pagehead .sub { color: var(--mute); }
.hash { font-family: var(--f-mono); font-size: .85rem; word-break: break-all; color: var(--text); }
.copy { margin-left: 8px; background: none; border: 1px solid var(--line-2); color: var(--mute); border-radius: 4px; font-family: var(--f-mono); font-size: .68rem; padding: 2px 6px; cursor: pointer; vertical-align: middle; }
.copy:hover { color: var(--ink); border-color: var(--ink); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.stat { padding: 18px 20px; display: grid; gap: 6px; align-content: start; border-left: 1px solid var(--line); }
.stat:nth-child(4n+1) { border-left: 0; }
.stat:nth-child(n+5) { border-top: 1px solid var(--line); }
.stat .k { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.stat .v { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.35rem, 2.4vw, 1.85rem); color: var(--ink); line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .v.hot { color: var(--fluor); }
.stat .d { font-family: var(--f-mono); font-size: .72rem; color: var(--mute); }
.meter { height: 6px; background: var(--panel-2); border-radius: 4px; overflow: hidden; display: flex; gap: 2px; margin-top: 4px; }
.meter i { display: block; height: 100%; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.card h2 { font-size: 1.1rem; }
.cardhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.cardhead .note { font-family: var(--f-mono); font-size: .72rem; color: var(--mute); }
section.block { margin-top: 22px; }

.live { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: .72rem; color: var(--mute); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--fluor); box-shadow: 0 0 0 0 rgba(255,95,21,.6); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,95,21,.55); } 70% { box-shadow: 0 0 0 8px rgba(255,95,21,0); } 100% { box-shadow: 0 0 0 0 rgba(255,95,21,0); } }
@media (prefers-reduced-motion: reduce) { .live i { animation: none; } }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; font-family: var(--f-mono); font-weight: 500; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); padding: 10px 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.fresh td { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { background: rgba(255,95,21,.14); } to { background: transparent; } }
tbody tr:hover td { background: rgba(255,255,255,.025); }
td .mono, td code { font-size: .82rem; }

.kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); }
.kv > div { padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv > div:nth-child(odd) { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); padding-top: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: .78rem; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line-2); text-decoration: none; color: var(--text); }
.chip:hover { border-color: var(--ink); color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.chain { background: var(--dag-chain); }
.dot.blue { background: var(--dag-blue); }
.dot.red { background: transparent; border: 2px dashed var(--dag-red); }
.dot.pending { background: transparent; border: 2px solid var(--mute); }
.badge { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text); }

.io { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); gap: 12px; align-items: start; }
.io .arrow { color: var(--fluor); font-family: var(--f-mono); text-align: center; padding-top: 10px; }
.io ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.io li { background: var(--void); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.io li .amt { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.io li .addr { font-family: var(--f-mono); font-size: .78rem; word-break: break-all; }
.io li .meta { font-family: var(--f-mono); font-size: .7rem; color: var(--mute); }

.amount { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.amount small { color: var(--mute); }
.pos { color: #7fd1a8; } .neg { color: var(--text); }
.bar { height: 8px; border-radius: 4px; background: var(--mark); min-width: 2px; }
.bartrack { background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.pager { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 14px; font-family: var(--f-mono); font-size: .78rem; color: var(--mute); }

.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--mute); font-family: var(--f-mono); font-size: 10px; }
.tip { position: absolute; pointer-events: none; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 10px; font-family: var(--f-mono); font-size: .72rem; color: var(--text); white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .12s; z-index: 2; }
.tip b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-family: var(--f-mono); font-size: .72rem; color: var(--mute); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }

.dag { position: relative; overflow-x: auto; border-radius: 8px; background: var(--void); border: 1px solid var(--line); }
.dag svg { display: block; }
.dag .edge { stroke: var(--line-2); stroke-width: 1.25; fill: none; }
.dag .edge.sp { stroke: var(--dag-chain); stroke-opacity: .55; stroke-width: 2; }
.dag a:hover circle { stroke: var(--ink); stroke-width: 2; }

.empty, .err { padding: 26px; text-align: center; color: var(--mute); font-family: var(--f-mono); font-size: .85rem; }
.err { color: var(--fluor-hi); }
.skel { display: inline-block; height: 1em; width: 6ch; border-radius: 4px; background: linear-gradient(90deg, var(--panel-2), #1f1914, var(--panel-2)); background-size: 200% 100%; animation: sk 1.2s infinite linear; vertical-align: middle; }
@keyframes sk { to { background-position: -200% 0; } }
.callout { border: 1px solid var(--line-2); border-left: 3px solid var(--fluor); border-radius: 6px; padding: 12px 14px; background: var(--panel); font-size: .9rem; }

footer { border-top: 1px solid var(--line); padding-block: 28px; color: var(--mute); font-size: .85rem; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; }

@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(odd) { border-left: 0; } .stat:nth-child(even) { border-left: 1px solid var(--line); }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .io { grid-template-columns: minmax(0, 1fr); } .io .arrow { transform: rotate(90deg); padding: 0; }
  .kv { grid-template-columns: minmax(0, 1fr); } .kv > div:nth-child(odd) { border-bottom: 0; padding-bottom: 0; }
  .hide-sm { display: none; }
}
@media (max-width: 560px) { .brandlink .wm { display: none; } .searchbar .btn { padding-inline: 12px; } }
</style>
</head>

<script>
"use strict";
const SAT = 100000000n, CAP = 1000000000000000n, CARRY = 99999999789793n;
const HALVING = 4204800, TARGET = 30;
const POW_LIMIT = BigInt("0xffff" + "0".repeat(60)); // target of compact bits 0x2100ffff = difficulty 1
const app = document.getElementById("app");
let timer = null;

// ── data ─────────────────────────────────────────────────────────────────────
async function api(method, params = []) {
  const r = await fetch(`/api/${method}?p=${encodeURIComponent(JSON.stringify(params))}`);
  let doc; try { doc = await r.json(); } catch { throw new Error(`HTTP ${r.status}`); }
  if (doc.error) throw new Error(doc.error);
  return doc.result;
}
async function carryover(addr) {
  try { const r = await fetch(`/api/carryover/${addr}`); return (await r.json()).result; } catch { return null; }
}

// ── formatting ───────────────────────────────────────────────────────────────
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const int = (n) => Number(n).toLocaleString("en-US");
function gnb(sat, { dp = 8, unit = true } = {}) {
  if (sat === null || sat === undefined) return "—";
  let v = BigInt(sat); const neg = v < 0n; if (neg) v = -v;
  const whole = (v / SAT).toLocaleString("en-US");
  let frac = (v % SAT).toString().padStart(8, "0").slice(0, dp).replace(/0+$/, "");
  return `${neg ? "−" : ""}${whole}${frac ? "." + frac : ""}${unit ? " <small>GNB</small>" : ""}`;
}
function compact(sat) {
  const g = Number(BigInt(sat) / 1000000n) / 100;
  if (g >= 1e6) return (g / 1e6).toFixed(2) + "M";
  if (g >= 1e3) return (g / 1e3).toFixed(1) + "k";
  return g.toFixed(2);
}
const short = (h, n = 10) => (h && h.length > 2 * n ? `${h.slice(0, n)}…${h.slice(-6)}` : h || "");
function ago(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return `${s}s ago`; if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m ago`;
  return `${Math.floor(s / 86400)}d ago`;
}
const utc = (ts) => new Date(ts * 1000).toISOString().replace("T", " ").replace(".000Z", " UTC");
function hashrate(h) { const u = ["H/s", "kH/s", "MH/s", "GH/s"]; let i = 0; while (h >= 1000 && i < 3) { h /= 1000; i++; } return `${h.toFixed(h < 10 ? 2 : 1)} ${u[i]}`; }
const diff = (d) => (d >= 1e6 ? (d / 1e6).toFixed(2) + "M" : d >= 1e3 ? (d / 1e3).toFixed(2) + "k" : Number(d).toFixed(2));
const link = { block: (h, t) => `<a class="mono" href="#/block/${h}">${esc(t || short(h))}</a>`, tx: (h, t) => `<a class="mono" href="#/tx/${h}">${esc(t || short(h))}</a>`, addr: (a, t) => (a ? `<a class="mono" href="#/address/${a}">${esc(t || short(a, 9))}</a>` : `<span class="muted">unknown</span>`) };
const copyBtn = (v) => `<button class="copy" data-copy="${esc(v)}" aria-label="Copy">copy</button>`;
const colourBadge = (c) => ({ chain: `<span class="badge"><i class="dot chain"></i>Selected chain</span>`, blue: `<span class="badge"><i class="dot blue"></i>Blue · merged</span>`, red: `<span class="badge"><i class="dot red"></i>Red · merged, no reward priority</span>`, pending: `<span class="badge"><i class="dot pending"></i>Not yet merged</span>` }[c] || `<span class="badge">${esc(c)}</span>`);
const loading = (label = "Loading") => `<div class="empty"><span class="skel"></span>&nbsp; ${esc(label)}…</div>`;
const fail = (e) => `<div class="err">${esc(e.message || e)}</div>`;

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-copy]"); if (!b) return;
  navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = "copied"; setTimeout(() => (b.textContent = "copy"), 1200); });
});

// ── charts (single series, brand mark colour, hover tooltips) ────────────────
function lineChart(points, { yLabel, fmt, height = 180 }) {
  if (points.length < 2) return `<div class="empty">Not enough data yet.</div>`;
  const W = 640, H = height, P = { l: 48, r: 10, t: 10, b: 22 };
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = 0, y1 = Math.max(...ys) * 1.1 || 1;
  const X = (x) => P.l + ((x - x0) / (x1 - x0 || 1)) * (W - P.l - P.r), Y = (y) => H - P.b - ((y - y0) / (y1 - y0)) * (H - P.t - P.b);
  const ticks = [0, .25, .5, .75, 1].map((f) => y0 + f * (y1 - y0));
  const d = points.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area = `${d}L${X(x1).toFixed(1)},${Y(0)}L${X(x0).toFixed(1)},${Y(0)}Z`;
  const id = "c" + Math.random().toString(36).slice(2, 8);
  return `<div class="chart" data-chart="${id}" data-points='${esc(JSON.stringify(points.map((p) => [X(p.x), Y(p.y), p.label])))}'>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yLabel)}">
   <defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--mark)" stop-opacity=".28"/><stop offset="1" stop-color="var(--mark)" stop-opacity="0"/></linearGradient></defs>
   <g class="grid">${ticks.map((t) => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}"/>`).join("")}</g>
   <g class="axis">${ticks.map((t) => `<text x="${P.l - 8}" y="${Y(t) + 3}" text-anchor="end">${esc(fmt(t))}</text>`).join("")}</g>
   <path d="${area}" fill="url(#${id}g)"/>
   <path d="${d}" fill="none" stroke="var(--mark)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
   <line class="xh" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="var(--line-2)" stroke-width="1" opacity="0"/>
   <circle class="xd" r="4.5" fill="var(--mark)" stroke="var(--void)" stroke-width="2" opacity="0"/>
   <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" class="hit"/>
  </svg><div class="tip"></div></div>`;
}
function barChart(bins, { fmt, height = 180 }) {
  const W = 640, H = height, P = { l: 40, r: 6, t: 10, b: 26 };
  const max = Math.max(1, ...bins.map((b) => b.y));
  const bw = (W - P.l - P.r) / bins.length;
  const Y = (y) => H - P.b - (y / max) * (H - P.t - P.b);
  const ticks = [0, .5, 1].map((f) => Math.round(f * max));
  return `<div class="chart" data-bars>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogram">
   <g class="grid">${ticks.map((t) => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}"/>`).join("")}</g>
   <g class="axis">${ticks.map((t) => `<text x="${P.l - 8}" y="${Y(t) + 3}" text-anchor="end">${t}</text>`).join("")}
   ${bins.map((b, i) => `<text x="${P.l + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(b.x)}</text>`).join("")}</g>
   ${bins.map((b, i) => { const x = P.l + i * bw + 1, h = Math.max(0, H - P.b - Y(b.y)), y = Y(b.y);
      return `<g class="bar-g" data-tip="${esc(fmt(b))}"><rect x="${x}" y="${P.t}" width="${bw - 2}" height="${H - P.t - P.b}" fill="transparent"/>${b.y ? `<path d="M${x},${y + h}V${y + Math.min(4, h)}Q${x},${y} ${x + Math.min(4, (bw - 2) / 2)},${y}H${x + bw - 2 - Math.min(4, (bw - 2) / 2)}Q${x + bw - 2},${y} ${x + bw - 2},${y + Math.min(4, h)}V${y + h}Z" fill="var(--mark)"/>` : ""}</g>`; }).join("")}
  </svg><div class="tip"></div></div>`;
}
function wireCharts(root) {
  root.querySelectorAll("[data-chart]").forEach((el) => {
    const pts = JSON.parse(el.dataset.points), svg = el.querySelector("svg"), tip = el.querySelector(".tip");
    const xh = svg.querySelector(".xh"), xd = svg.querySelector(".xd");
    const move = (ev) => {
      const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, x = ((ev.clientX - r.left) / r.width) * vb.width;
      let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - x) < Math.abs(best[0] - x)) best = p;
      xh.setAttribute("x1", best[0]); xh.setAttribute("x2", best[0]); xh.setAttribute("opacity", 1);
      xd.setAttribute("cx", best[0]); xd.setAttribute("cy", best[1]); xd.setAttribute("opacity", 1);
      tip.innerHTML = best[2]; tip.style.left = `${(best[0] / vb.width) * r.width}px`; tip.style.top = `${(best[1] / vb.height) * r.height}px`; tip.style.opacity = 1;
    };
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerleave", () => { tip.style.opacity = 0; xh.setAttribute("opacity", 0); xd.setAttribute("opacity", 0); });
  });
  root.querySelectorAll("[data-bars]").forEach((el) => {
    const svg = el.querySelector("svg"), tip = el.querySelector(".tip");
    el.querySelectorAll(".bar-g").forEach((g) => {
      g.addEventListener("pointerenter", () => {
        const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, b = g.querySelector("rect");
        tip.innerHTML = g.dataset.tip;
        tip.style.left = `${((+b.getAttribute("x") + +b.getAttribute("width") / 2) / vb.width) * r.width}px`;
        tip.style.top = `${(+b.getAttribute("y") / vb.height) * r.height + 20}px`; tip.style.opacity = 1;
      });
      g.addEventListener("pointerleave", () => (tip.style.opacity = 0));
    });
  });
}

// ── DAG drawing ──────────────────────────────────────────────────────────────
function dagSvg(nodes, { height = 230, compactMode = false } = {}) {
  if (!nodes.length) return `<div class="empty">No blocks yet.</div>`;
  const byScore = new Map();
  for (const n of nodes) { if (!byScore.has(n.blue_score)) byScore.set(n.blue_score, []); byScore.get(n.blue_score).push(n); }
  const scores = [...byScore.keys()].sort((a, b) => a - b);
  const colW = compactMode ? 34 : 46, H = height, padX = 24;
  const W = Math.max(padX * 2 + (scores.length - 1) * colW, 320);
  const pos = new Map();
  scores.forEach((s, i) => {
    const col = byScore.get(s).sort((a, b) => (a.colour === "chain" ? -1 : b.colour === "chain" ? 1 : a.hash < b.hash ? -1 : 1));
    col.forEach((n, j) => {
      const lane = j === 0 ? 0 : (j % 2 ? 1 : -1) * Math.ceil(j / 2);
      pos.set(n.hash, { x: padX + i * colW, y: H / 2 + lane * 44, n });
    });
  });
  let edges = "", dots = "";
  for (const [h, p] of pos) for (const par of p.n.parents) {
    const q = pos.get(par); if (!q) continue;
    const sp = par === p.n.selected_parent && p.n.colour === "chain";
    const mx = (p.x + q.x) / 2;
    edges += `<path class="edge${sp ? " sp" : ""}" d="M${q.x},${q.y}C${mx},${q.y} ${mx},${p.y} ${p.x},${p.y}"/>`;
  }
  for (const [h, p] of pos) {
    const c = p.n.colour, r = c === "chain" ? 9 : 7;
    const fill = c === "chain" ? "var(--dag-chain)" : c === "blue" ? "var(--dag-blue)" : "var(--void)";
    const stroke = c === "red" ? `stroke="var(--dag-red)" stroke-width="2.5" stroke-dasharray="3 2.5"` : c === "pending" ? `stroke="var(--mute)" stroke-width="2"` : `stroke="var(--void)" stroke-width="2"`;
    dots += `<a href="#/block/${h}"><title>${esc(`${c} · height ${p.n.height} · blue score ${p.n.blue_score} · ${short(h)}`)}</title><circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fill}" ${stroke}/></a>`;
  }
  return `<div class="dag"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Recent block DAG">${edges}${dots}</svg></div>
  <div class="legend" style="margin-top:12px"><span><i class="dot chain"></i>Selected chain</span><span><i class="dot blue"></i>Blue (merged)</span><span><i class="dot red"></i>Red (merged, outside k-cluster)</span><span><i class="dot pending"></i>Tip, not yet merged</span><span>Left → right: blue score</span></div>`;
}
function scrollDagEnd(root) { root.querySelectorAll(".dag").forEach((d) => (d.scrollLeft = d.scrollWidth)); }

// ── views ────────────────────────────────────────────────────────────────────
function blocksTable(blocks, freshSet = new Set()) {
  if (!blocks.length) return `<div class="empty">No blocks.</div>`;
  return `<div class="tablewrap"><table><thead><tr><th class="num">Height</th><th>Block</th><th>Age</th><th>Miner</th><th class="num">Reward</th><th class="num hide-sm">Txs</th><th class="num hide-sm">Merged</th><th class="num hide-sm">Difficulty</th></tr></thead><tbody>
  ${blocks.map((b) => `<tr class="${freshSet.has(b.hash) ? "fresh" : ""}"><td class="num mono">${int(b.height)}</td><td>${link.block(b.hash)}</td><td class="muted">${ago(b.timestamp)}</td><td>${link.addr(b.miner)}</td><td class="num amount">${b.reward ? gnb(b.reward, { dp: 4 }) : "—"}</td><td class="num hide-sm">${b.tx_count ?? "—"}</td><td class="num hide-sm">${b.merged}${b.reds ? ` <span class="muted">(${b.reds} red)</span>` : ""}</td><td class="num hide-sm mono">${b.difficulty ? diff(b.difficulty) : "—"}</td></tr>`).join("")}
  </tbody></table></div>`;
}

let lastSeen = new Set();
async function viewHome(refresh = false) {
  if (!refresh) app.innerHTML = `<div class="pagehead"><span class="eyebrow">GnB mainnet</span><h1>Network overview</h1><p class="sub">A BlockDAG secured by GnB-SMH, a sequential memory-hard proof of work. Live data, refreshed every 10 seconds.</p></div><div id="h-stats">${loading("Reading the chain")}</div><div id="h-rest"></div>`;
  const [dag, supply, stats, pct, chain, window, hist, mem] = await Promise.all([
    api("getdaginfo"), api("getsupplyinfo"), api("getchainstats"), api("getblocktimepercentiles"),
    api("getselectedchain", [0, 12]), api("getdagwindow", [90]), api("getdifficultyhistory", [200]), api("getmempoolstats"),
  ]);
  const issued = BigInt(supply.issued_sat), total = CARRY + issued;
  const nextHalving = supply.next_halving_height - supply.current_height;
  const stat = (k, v, d, hot = false) => `<div class="stat"><span class="k">${k}</span><span class="v ${hot ? "hot" : ""}">${v}</span>${d ? `<span class="d">${d}</span>` : ""}</div>`;
  const pctCarry = Number((CARRY * 10000n) / CAP) / 100, pctMined = Number((issued * 1000000n) / CAP) / 10000;
  document.getElementById("h-stats").innerHTML = `<div class="stats">
   ${stat("Chain height", int(dag.tip_height), `blue score ${int(dag.tip_blue_score)} · ${int(dag.block_count)} blocks in DAG`, true)}
   ${stat("Block time", `${pct.p50_secs}s`, `median of last ${pct.window} · mean ${pct.avg_secs.toFixed(1)}s · target ${pct.target_secs}s`)}
   ${stat("Hashrate", hashrate(stats.hashrate_hs), "GnB-SMH evaluations per second")}
   ${stat("Difficulty", diff(chain.blocks[0]?.difficulty || 0), `ASERT · bits ${esc(chain.blocks[0]?.bits || "")}`)}
   ${stat("Circulating", `${compact(total.toString())}`, `of 10M GNB cap · ${pctCarry.toFixed(2)}% carryover + ${pctMined.toFixed(4)}% mined<div class="meter" aria-hidden="true"><i style="width:${pctCarry}%;background:var(--mark)"></i><i style="width:${Math.max(pctMined, 0.3)}%;background:var(--fluor-hi)"></i></div>`)}
   ${stat("Block reward", `${(Number(supply.subsidy_per_block_sat) / 1e8).toFixed(4)}`, `GNB · next halving in ${int(nextHalving)} blocks`)}
   ${stat("Mempool", int(mem.size), `min fee ${(Number(supply.min_tx_fee_sat) / 1e8).toFixed(4)} GNB`)}
   ${stat("Tips", int(dag.tip_count), `GhostDAG k = ${dag.k}`)}
  </div>`;
  const fresh = new Set(chain.blocks.filter((b) => refresh && !lastSeen.has(b.hash)).map((b) => b.hash));
  lastSeen = new Set(chain.blocks.map((b) => b.hash));
  const pts = [...hist.points].reverse();
  const diffPts = pts.map((p) => ({ x: p.timestamp, y: Number((POW_LIMIT * 1000n) / BigInt("0x" + p.target_hex)) / 1000, label: `<b>height ${int(p.height)}</b> · ${esc(p.bits_hex)} · ${utc(p.timestamp)}` }));
  // block-interval histogram from consecutive chain timestamps
  const gaps = []; for (let i = 1; i < pts.length; i++) gaps.push(Math.max(0, pts[i].timestamp - pts[i - 1].timestamp));
  const edges = [0, 10, 20, 30, 40, 50, 60, 90, 120, 180, 300];
  const bins = edges.map((e, i) => ({ x: i === edges.length - 1 ? `${e}+` : `${e}–${edges[i + 1]}`, lo: e, hi: edges[i + 1] ?? Infinity, y: 0 }));
  for (const g of gaps) bins.find((b) => g >= b.lo && g < b.hi).y++;
  const rest = document.getElementById("h-rest");
  rest.innerHTML = `
   <section class="block card"><div class="cardhead"><h2>Block DAG</h2><span class="live"><i></i>live · last ${window.nodes.length} blocks</span></div>${dagSvg(window.nodes)}</section>
   <section class="block card"><div class="cardhead"><h2>Latest chain blocks</h2><a class="note" href="#/blocks">All blocks →</a></div>${blocksTable(chain.blocks, fresh)}</section>
   <div class="grid2 block" style="margin-top:22px">
    <section class="card"><div class="cardhead"><h2>Difficulty</h2><span class="note">expected evaluations per block, last ${pts.length} blocks</span></div>${lineChart(diffPts, { yLabel: "Difficulty", fmt: (v) => (v >= 1000 ? (v / 1000).toFixed(1) + "k" : Math.round(v).toString()) })}</section>
    <section class="card"><div class="cardhead"><h2>Time between blocks</h2><span class="note">seconds, last ${gaps.length} intervals · target ${TARGET}s</span></div>${barChart(bins, { fmt: (b) => `<b>${b.y} blocks</b> · ${b.lo}${b.hi === Infinity ? "+" : "–" + b.hi} s` })}</section>
   </div>`;
  wireCharts(rest); scrollDagEnd(rest);
}

async function viewBlocks(page = 0) {
  const per = 50;
  app.innerHTML = `<div class="pagehead"><span class="eyebrow">Selected chain</span><h1>Blocks</h1><p class="sub">Chain blocks, newest first. Blocks merged off the chain are listed in each chain block's mergeset.</p></div><div class="card" id="b-list">${loading()}</div>`;
  const r = await api("getselectedchain", [page * per, per]);
  const pages = Math.ceil(r.chain_length / per);
  document.getElementById("b-list").innerHTML = `${blocksTable(r.blocks)}<div class="pager"><span>page ${page + 1} of ${pages}</span>
   <a class="btn ghost" ${page ? `href="#/blocks/${page - 1}"` : 'aria-disabled="true" style="opacity:.4;pointer-events:none"'}>← Newer</a>
   <a class="btn ghost" ${page + 1 < pages ? `href="#/blocks/${page + 1}"` : 'aria-disabled="true" style="opacity:.4;pointer-events:none"'}>Older →</a></div>`;
}

async function viewDag() {
  app.innerHTML = `<div class="pagehead"><span class="eyebrow">GhostDAG · k = 10</span><h1>The block DAG</h1><p class="sub">Every block points to all tips it knew about. GhostDAG picks a selected parent chain and colours each merged block blue (inside the k-cluster) or red. Click any block.</p></div><div class="card" id="d-dag">${loading()}</div>`;
  const w = await api("getdagwindow", [300]);
  const el = document.getElementById("d-dag");
  el.innerHTML = dagSvg(w.nodes, { height: 300 }); scrollDagEnd(el);
}

async function viewBlock(hash) {
  app.innerHTML = loading("Loading block");
  const b = await api("getblockdag", [hash]);
  const chips = (list, cls) => list.length ? `<div class="chips">${list.map((h) => `<a class="chip" href="#/block/${h}"><i class="dot ${cls}"></i>${short(h, 8)}</a>`).join("")}</div>` : `<span class="muted">none</span>`;
  const cb = b.transactions?.[0];
  app.innerHTML = `<div class="pagehead"><span class="eyebrow">Block</span><h1>Block ${int(b.height)}</h1><div class="hash">${esc(b.hash)}${copyBtn(b.hash)}</div><div>${colourBadge(b.colour)}</div></div>
  <div class="grid2">
   <section class="card"><div class="cardhead"><h2>Header</h2></div><div class="kv">
    <div>Timestamp</div><div>${utc(b.timestamp)} <span class="muted">(${ago(b.timestamp)})</span></div>
    <div>Height · blue score</div><div class="mono">${int(b.height)} · ${int(b.blue_score)}</div>
    <div>Confirmations</div><div class="mono">${int(b.confirmations)} <span class="muted">blue score</span></div>
    <div>Difficulty</div><div class="mono">${b.difficulty ? diff(b.difficulty) : "—"} <span class="muted">bits ${esc(b.bits || "")}</span></div>
    <div>Nonce</div><div class="mono">${esc(b.nonce ?? "—")}</div>
    <div>Merkle root</div><div class="hash">${esc(b.merkle_root || "—")}</div>
    <div>Size</div><div class="mono">${b.size ? int(b.size) + " bytes" : "—"}</div>
    <div>Miner</div><div class="hash">${cb ? link.addr(cb.outputs[0]?.address, cb.outputs[0]?.address) : "—"}</div>
    <div>Reward</div><div class="amount">${cb ? gnb(cb.total_out) : "—"}${cb && b.colour !== "chain" ? `<div class="muted" style="font-family:var(--f-text);font-size:.85rem">Not credited: only selected-chain blocks apply their transactions to the ledger.</div>` : ""}</div>
   </div></section>
   <section class="card"><div class="cardhead"><h2>Place in the DAG</h2></div><div class="kv">
    <div>Selected parent</div><div>${b.selected_parent ? `<a class="chip" href="#/block/${b.selected_parent}"><i class="dot chain"></i>${short(b.selected_parent, 8)}</a>` : `<span class="muted">genesis</span>`}</div>
    <div>Parents (${b.parents.length})</div><div>${chips(b.parents, "pending")}</div>
    <div>Merged blue (${b.mergeset_blues.length})</div><div>${chips(b.mergeset_blues, "blue")}</div>
    <div>Merged red (${b.mergeset_reds.length})</div><div>${chips(b.mergeset_reds, "red")}</div>
    ${b.merged_by ? `<div>Merged by</div><div><a class="chip" href="#/block/${b.merged_by}"><i class="dot chain"></i>${short(b.merged_by, 8)}</a></div>` : ""}
    ${b.next_chain_block ? `<div>Next chain block</div><div><a class="chip" href="#/block/${b.next_chain_block}"><i class="dot chain"></i>${short(b.next_chain_block, 8)}</a></div>` : ""}
    <div>Blue work</div><div class="mono">${int(b.blue_work)}</div>
   </div></section>
  </div>
  <section class="block card"><div class="cardhead"><h2>Transactions (${b.transactions?.length ?? 0})</h2>${b.colour !== "chain" ? `<span class="note">off the selected chain · not applied</span>` : ""}</div>${(b.transactions || []).map((t) => txCard(t, false, b.colour !== "chain")).join("") || `<div class="empty">Block body not stored on this node.</div>`}</section>`;
}

function txCard(t, standalone = false, offChain = false) {
  const ins = t.coinbase
    ? `<li><span class="meta">Coinbase</span><span class="addr">${esc(t.inputs[0]?.coinbase || "")}</span></li>`
    : t.inputs.map((i) => `<li><span class="amt">${i.value ? gnb(i.value) : `<span class="muted">value from carryover</span>`}</span><span class="addr">${link.addr(i.address, i.address)}</span><span class="meta">${link.tx(i.prev_txid, short(i.prev_txid, 8))}:${i.prev_index}</span></li>`).join("");
  const outs = t.outputs.map((o) => `<li><span class="amt">${gnb(o.value)}</span><span class="addr">${link.addr(o.address, o.address)}</span><span class="meta">#${o.index} · ${offChain ? "not applied" : o.spent ? "spent" : "unspent"}</span></li>`).join("");
  return `<div style="border-top:1px solid var(--line);padding-top:16px;margin-top:16px">
   ${standalone ? "" : `<div class="cardhead" style="margin-bottom:10px"><div>${link.tx(t.txid, short(t.txid, 14))} ${t.coinbase ? `<span class="badge" style="margin-left:6px">coinbase</span>` : ""}</div><span class="note">${int(t.size)} bytes${t.fee ? ` · fee ${gnb(t.fee)}` : ""}</span></div>`}
   <div class="io"><ul aria-label="Inputs">${ins}</ul><div class="arrow">→</div><ul aria-label="Outputs">${outs}</ul></div></div>`;
}

async function viewTx(txid) {
  app.innerHTML = loading("Loading transaction");
  const r = await api("gettransactionfull", [txid]);
  const t = r.transaction;
  app.innerHTML = `<div class="pagehead"><span class="eyebrow">Transaction</span><h1>${t.coinbase ? "Coinbase transaction" : "Transaction"}</h1><div class="hash">${esc(t.txid)}${copyBtn(t.txid)}</div><div>${r.status === "mempool" ? `<span class="badge"><i class="dot pending"></i>In mempool</span>` : colourBadge(r.block_colour)}</div></div>
  <section class="card"><div class="kv">
   <div>Status</div><div>${r.status === "mempool" ? "Waiting in the mempool" : `Confirmed in ${link.block(r.block_hash)} at height ${int(r.block_height)}`}</div>
   ${r.timestamp ? `<div>Time</div><div>${utc(r.timestamp)} <span class="muted">(${ago(r.timestamp)})</span></div>` : ""}
   <div>Total out</div><div class="amount">${gnb(t.total_out)}</div>
   <div>Fee</div><div class="amount">${t.fee ? gnb(t.fee) : t.coinbase ? "—" : `<span class="muted">unknown (spends carryover outputs)</span>`}</div>
   <div>Size</div><div class="mono">${int(t.size)} bytes</div>
  </div>${txCard(t, true, r.status !== "mempool" && r.block_colour !== "chain")}</section>`;
}

async function viewAddress(addr, page = 0) {
  const per = 25;
  app.innerHTML = loading("Loading address");
  const [h, carry] = await Promise.all([api("getaddresshistory", [addr, per, page * per]), carryover(addr)]);
  const pages = Math.max(1, Math.ceil(h.total / per));
  app.innerHTML = `<div class="pagehead"><span class="eyebrow">Address</span><h1 class="amount" style="font-family:var(--f-display)">${gnb(h.balance)}</h1><div class="hash">${esc(addr)}${copyBtn(addr)}</div></div>
  <div class="grid2">
   <section class="card"><div class="kv">
    <div>Balance</div><div class="amount">${gnb(h.balance)}</div>
    <div>Unspent outputs</div><div class="mono">${int(h.utxo_count)}</div>
    <div>Share of 10M cap</div><div class="mono">${(Number((BigInt(h.balance) * 1000000n) / CAP) / 10000).toFixed(4)}%</div>
    <div>Transactions</div><div class="mono">${int(h.total)} <span class="muted">indexed movements</span></div>
   </div></section>
   <section class="card"><div class="cardhead"><h2>Bloch carryover</h2></div>${carry && carry.in_carryover
      ? `<div class="kv"><div>Received at genesis</div><div class="amount">${gnb(carry.amount)}</div><div>From Bloch G3</div><div class="mono">${int(BigInt(carry.bloch_amount) / SAT)} BLCH · ${int(carry.utxos)} outputs</div></div><p class="muted" style="margin-top:12px;font-size:.9rem">Same owner hash as the Bloch Genesis-3 address <span class="mono">bloch1q${esc(addr.slice(5))}</span>, converted at 1,000,000 GNB for 3,810,744,000 BLCH.</p>`
      : `<p class="muted">This address held nothing in the Bloch Genesis-3 snapshot.</p>`}</section>
  </div>
  <section class="block card"><div class="cardhead"><h2>History</h2><span class="note">newest first</span></div>
  ${h.items.length ? `<div class="tablewrap"><table><thead><tr><th class="num">Height</th><th>Transaction</th><th>Direction</th><th class="num">Amount</th></tr></thead><tbody>
   ${h.items.map((i) => `<tr><td class="num mono">${int(i.height)}</td><td>${link.tx(i.txid)}</td><td>${i.direction === "in" ? "received" : "sent"}</td><td class="num amount ${i.direction === "in" ? "pos" : "neg"}">${i.direction === "in" ? "+" : "−"}${gnb(i.amount)}</td></tr>`).join("")}
  </tbody></table></div><div class="pager"><span>page ${page + 1} of ${pages}</span>
   <a class="btn ghost" ${page ? `href="#/address/${addr}/${page - 1}"` : 'style="opacity:.4;pointer-events:none"'}>← Newer</a>
   <a class="btn ghost" ${page + 1 < pages ? `href="#/address/${addr}/${page + 1}"` : 'style="opacity:.4;pointer-events:none"'}>Older →</a></div>`
   : `<div class="empty">${carry && carry.in_carryover ? "No on-chain movements yet; the balance comes from the genesis carryover." : "No movements yet."}</div>`}</section>`;
}

async function viewHolders() {
  app.innerHTML = `<div class="pagehead"><span class="eyebrow">Distribution</span><h1>Holders</h1><p class="sub">Balances from the UTXO set: the converted Bloch Genesis-3 carryover plus everything mined since genesis.</p></div><div id="ho">${loading()}</div>`;
  const [rich, dist] = await Promise.all([api("getrichlist", [100, 0]), api("getsupplydistribution")]);
  const max = Math.max(...dist.tiers.map((t) => t.pct_of_supply), 1);
  document.getElementById("ho").innerHTML = `
  <div class="callout" style="margin-bottom:20px">The carryover is concentrated: in the Bloch Genesis-3 snapshot one address held about 94% of all coins, and that share carries over unchanged.</div>
  <section class="card"><div class="cardhead"><h2>By balance</h2><span class="note">${int(dist.holders)} addresses · ${gnb(dist.total_supply, { dp: 2 })}</span></div>
   <div class="tablewrap"><table><thead><tr><th>Balance</th><th class="num">Addresses</th><th class="num">GNB</th><th style="width:40%">Share of supply</th></tr></thead><tbody>
   ${dist.tiers.map((t) => `<tr><td class="mono">${esc(t.label)}</td><td class="num">${int(t.address_count)}</td><td class="num amount">${gnb(t.total_sats, { dp: BigInt(t.total_sats) < SAT ? 8 : 2 })}</td><td><div style="display:flex;align-items:center;gap:10px"><div class="bartrack" style="flex:1"><div class="bar" style="width:${(t.pct_of_supply / max) * 100}%"></div></div><span class="mono muted" style="width:7ch;text-align:right">${t.pct_of_supply.toFixed(t.pct_of_supply < 0.01 ? 4 : 2)}%</span></div></td></tr>`).join("")}
   </tbody></table></div></section>
  <section class="block card"><div class="cardhead"><h2>Top holders</h2><span class="note">updated every ~2 minutes</span></div>
   <div class="tablewrap"><table><thead><tr><th class="num">#</th><th>Address</th><th class="num">Balance</th><th class="num hide-sm">Outputs</th><th class="num">Share</th></tr></thead><tbody>
   ${rich.items.map((i) => `<tr><td class="num mono">${i.rank}</td><td>${link.addr(i.address)}</td><td class="num amount">${gnb(i.balance, { dp: 4 })}</td><td class="num hide-sm">${int(i.utxos)}</td><td class="num mono">${(i.share * 100).toFixed(i.share < 0.0001 ? 6 : 3)}%</td></tr>`).join("")}
   </tbody></table></div></section>`;
}

// ── search & routing ─────────────────────────────────────────────────────────
document.getElementById("search").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (!q) return;
  if (/^gnb1[qt][0-9a-f]{48}$/.test(q)) return go(`#/address/${q}`);
  if (/^bloch1q[0-9a-f]{48}$/.test(q)) return go(`#/address/gnb1q${q.slice(7)}`);
  if (/^\d+$/.test(q)) {
    const dag = await api("getdaginfo");
    const off = dag.chain_length - 1 - Number(q);
    if (off < 0) return (app.innerHTML = `<div class="err">Height ${esc(q)} is above the tip (${int(dag.tip_height)}).</div>`);
    const r = await api("getselectedchain", [off, 1]);
    return go(`#/block/${r.blocks[0].hash}`);
  }
  if (/^[0-9a-f]{64}$/.test(q)) {
    try { await api("getblockdag", [q]); return go(`#/block/${q}`); } catch {}
    return go(`#/tx/${q}`);
  }
  app.innerHTML = `<div class="err">Not a block hash, transaction id, gnb1q… address or height.</div>`;
});
function go(h) { if (location.hash === h) route(); else location.hash = h; }

async function route() {
  clearInterval(timer); timer = null;
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const [v, a, b] = parts;
  document.querySelectorAll("[data-nav]").forEach((n) => n.removeAttribute("aria-current"));
  const nav = { "": "home", blocks: "blocks", dag: "dag", holders: "holders" }[v || ""];
  if (nav) document.querySelector(`[data-nav="${nav}"]`)?.setAttribute("aria-current", "page");
  window.scrollTo(0, 0);
  try {
    if (!v) { await viewHome(); timer = setInterval(() => viewHome(true).catch(() => {}), 10000); }
    else if (v === "blocks") await viewBlocks(Number(a) || 0);
    else if (v === "dag") { await viewDag(); timer = setInterval(() => viewDag().catch(() => {}), 15000); }
    else if (v === "holders") await viewHolders();
    else if (v === "block" && /^[0-9a-f]{64}$/.test(a)) await viewBlock(a);
    else if (v === "tx" && /^[0-9a-f]{64}$/.test(a)) await viewTx(a);
    else if (v === "address" && /^gnb1[qt][0-9a-f]{48}$/.test(a)) await viewAddress(a, Number(b) || 0);
    else app.innerHTML = `<div class="err">Page not found. <a href="#/">Back to the overview</a></div>`;
  } catch (e) { app.innerHTML = fail(e); }
}
window.addEventListener("hashchange", route);
route();
</script>
