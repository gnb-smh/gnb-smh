<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>GnB Explorer</title>
<meta name="description" content="GnB explorer: blocks, the block DAG, PoWit finality signed with forward-secure KES keys (Proof of Context and Time), and the Bloch bridge vault.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="explorer.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#/" aria-label="GnB Explorer home">
      <img src="../favicon.svg" alt="" width="28" height="28">
      <span class="brand-name">GnB <b>Explorer</b></span>
    </a>
    <form class="search" id="search" role="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Height, block hash, txid or gnb1… address" aria-label="Search">
    </form>
    <span class="chip" id="netchip"><span class="dot"></span><span id="nettext">connecting…</span></span>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="Sections">
    <a href="#/" data-tab="overview">Overview</a>
    <a href="#/blocks" data-tab="blocks">Blocks</a>
    <a href="#/dag" data-tab="dag">DAG</a>
    <a href="#/finality" data-tab="finality">Finality · PoWit KES</a>
    <a href="#/vault" data-tab="vault">Bloch bridge</a>
    <a href="#/mempool" data-tab="mempool">Mempool</a>
    <a href="../" class="tab-out">Site ↗</a>
    <a href="../wallet/" class="tab-out">Wallet ↗</a>
  </nav>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer class="foot wrap">
  <span>GnB · post-quantum proof-of-work sidechain of Bloch</span>
  <span id="footsrc">data: this site's read-only node API</span>
</footer>
<script type="module" src="explorer.js"></script>
</body>
</html>
