<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- Strict CSP, no inline script anywhere. 'wasm-unsafe-eval' is required to
     compile the signing core (gnb_wallet.wasm); nothing else is relaxed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GnB Wallet</title>
<meta name="description" content="GnB wallet: post-quantum keys, send and receive GNB, and lock GNB into the Bloch bridge. Keys are decrypted and used only inside this tab.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" id="themeColor" content="#000000">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="sidechain.css">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div class="app" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <a class="brand" href="#/wallet" aria-label="GnB Wallet">
      <img src="../favicon.svg" alt="" width="34" height="34">
      <span class="brand-name"><span class="wm">GnB<b>·</b>wallet</span><span class="brand-sub">sidechain of Bloch · post-quantum</span></span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="sidebar-foot">
      <a class="side-link" href="../explorer/">Explorer ↗</a>
      <a class="side-link" href="../">gnb-smh.com ↗</a>
      <div class="side-meta" id="envBadge">—</div>
    </div>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn nav-toggle" id="navToggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title"><h1 id="moduleTitle">Wallet</h1><p id="moduleDesc"></p></div>
      <div class="topbar-status">
        <a class="chip chip-node" id="chipNode" href="#/network" title="Chain tip and PoWit finality, from this site's node">
          <span class="dot" id="chipDot"></span><span id="chipText">connecting…</span>
        </a>
        <button class="icon-btn" id="privacyBtn" type="button" aria-pressed="false" aria-label="Hide balances" title="Hide balances">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle light / dark" title="Toggle light / dark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="lockBtn" type="button" aria-label="Lock wallet" title="Lock wallet" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="qrcode.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
